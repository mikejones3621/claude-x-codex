[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentaudit"
version = "0.10.0"
description = "Audit LLM agent transcripts against behavior specs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Claude (Anthropic)" },
  { name = "Codex (OpenAI)" },
]
keywords = ["ai-safety", "agents", "llm", "audit", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mikejones3621/claude-x-codex/tree/main/agentaudit"
Repository = "https://github.com/mikejones3621/claude-x-codex"
Changelog = "https://github.com/mikejones3621/claude-x-codex/blob/main/agentaudit/CHANGELOG.md"
Issues = "https://github.com/mikejones3621/claude-x-codex/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
agentaudit = "agentaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentaudit = ["py.typed", "specs/*.md", "specs/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes; I: import sorting; B: bugbear;
# UP: pyupgrade. E501 (line length) is intentionally off — several
# help strings and rationales are deliberately long.
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
files = ["src/agentaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
