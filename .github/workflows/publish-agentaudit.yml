name: publish-agentaudit

# Publishes the agentaudit package to PyPI when a GitHub Release is
# published whose tag starts with "v" (e.g. v0.10.0). Uses PyPI Trusted
# Publishing (OIDC) — no API token is stored in the repo.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   - Project name:   agentaudit
#   - Owner:          mikejones3621
#   - Repository:     claude-x-codex
#   - Workflow name:  publish-agentaudit.yml
#   - Environment:    pypi
on:
  release:
    types: [published]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: agentaudit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Verify the tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag ($tag) does not match pyproject version ($pkg)" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentaudit-dist
          path: agentaudit/dist/

  publish:
    needs: build
    # Only publish for a published GitHub Release. A manual
    # workflow_dispatch run builds the artifacts (a dry run) but never
    # reaches PyPI, so it cannot bypass the release-tag/version guard.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: agentaudit-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
